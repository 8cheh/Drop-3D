[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "drop3d"
version = "0.1.0"
description = "Reconstruct droplet shape from images and measure interfacial properties"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "TBD - see docs/decisions/0001-license.md" }
authors = [{ name = "Drop-3D team" }]
keywords = ["pendant drop", "surface tension", "contact angle", "surface free energy",
            "young-laplace", "tensiometry"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Image Processing",
]

# Runtime dependencies are deliberately minimal. numpy and scipy carry the
# numerics; anything heavier (OpenCV, PyTorch) must be justified before it is
# added, because every dependency is also a licence and a build burden.
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
# There is deliberately no "imaging" extra.  One was declared for OpenCV, but
# nothing in the package ever imported cv2 -- segmentation is done with
# scipy.ndimage -- so it advertised a dependency that was not used.  If a real
# need for OpenCV appears, add it back together with the code that needs it.
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.5",
    # Needed by tests/test_desktop_api.py, which exercises the desktop image
    # loader (decoding a camera file into the 2D array the library expects).
    # The tests skip themselves without it, but then the only code path that
    # reads a real file would never be tested.
    "pillow>=10.0",
]
# The Windows desktop interface (see desktop/).  Kept out of the core install on
# purpose: the library's runtime dependencies are numpy + scipy and stay that
# way, so a user who only wants the numerics never downloads a GUI stack.
# Rationale and licence check in docs/decisions/0003-desktop-gui.md.
gui = [
    "pywebview>=5.0",   # BSD-3-Clause; wraps the Edge WebView2 runtime
    "pillow>=10.0",     # HPND/MIT-CMU; decodes camera images
]

[project.scripts]
drop3d-ps = "drop3d.tools.shape_parameter_scan:main"
drop3d-gui = "drop3d_desktop.__main__:main"

[tool.setuptools.packages.find]
where = ["src", "desktop/src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: tests that take more than a few seconds",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# E,F = pycodestyle/pyflakes; I = import sorting; UP = pyupgrade;
# B = bugbear; SIM = simplify; NPY = numpy-specific rules
select = ["E", "F", "W", "I", "UP", "B", "SIM", "NPY"]
ignore = [
    "E501",   # line length is handled by the formatter, not the linter
    "B008",   # function calls in argument defaults are fine for our API style
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]   # assert False is fine in tests
