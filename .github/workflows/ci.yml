name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same ref. The suite takes a few minutes, and
# there is no reason to spend them on a commit that has already been replaced.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lint runs once, not in every matrix leg. It is the same check regardless of
  # the interpreter, and when it shared a job with pytest a single lint slip
  # *skipped* the tests on all three versions -- so the cheapest check was
  # hiding the most important one.
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check src tests desktop

  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Test (pytest)
        run: pytest -q

  # The numerics are the product. If the solver stops reproducing the exact
  # Bo = 0 sphere, or the end-to-end synthetic recovery degrades, that is a
  # correctness failure and it should be obvious in the job list rather than
  # buried in a passing test count.
  numerics:
    name: numerics invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Exact Bo=0 sphere identity
        run: pytest -q tests/test_younglaplace.py -k "zero_bond or sphere_volume"

      - name: Synthetic round-trip and end-to-end recovery
        run: pytest -q tests/test_tensiometry.py -k "round_trip or end_to_end"

      - name: Validity gate refuses when it should, and not when it shouldn't
        run: pytest -q tests/test_validity.py

  # The desktop bridge is a plain object with no window, so it is testable on a
  # headless runner.  That is deliberate: it is the only part of the GUI that can
  # be checked without a display, and it is where a wrong payload turns into a
  # dead button.  pywebview is not installed here and must not be needed.
  desktop:
    name: desktop bridge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (without the GUI extra)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: The bridge must import without pywebview present
        run: python -c "import drop3d_desktop.api, drop3d_desktop.serialize, drop3d_desktop.images"

      - name: Bridge and public-surface tests
        run: pytest -q tests/test_desktop_api.py tests/test_public_api.py
