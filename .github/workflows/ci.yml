name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same ref: this repo's test suite is fast, but
# there is no reason to burn CI minutes on a commit that has already been
# replaced.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src tests tools

      - name: Test (pytest)
        run: pytest -q

  # The numerics are the product. If the solver stops reproducing the exact
  # Bo = 0 sphere, or the end-to-end synthetic recovery degrades, that is a
  # correctness failure and it should be obvious in the job list rather than
  # buried in a passing test count.
  numerics:
    name: numerics invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Exact Bo=0 sphere identity
        run: pytest -q tests/test_younglaplace.py -k "zero_bond or sphere_volume"

      - name: Synthetic round-trip and end-to-end recovery
        run: pytest -q tests/test_tensiometry.py -k "round_trip or end_to_end"
